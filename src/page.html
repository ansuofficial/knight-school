<title>/*__TITLE__*/</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&display=swap">
<style>
/* Page reset. The claude.ai host adds these two rules; a standalone page needs its own.
   [hidden] must beat the display values below, or the start screen, cards and sheet would all show at once. */
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: a full-bleed 3D wooden board on cream. A warm-white panel holds the lessons and the coach: beside the
   board on wide screens, a sheet under it on phones. At rest: only Start, over a board that slowly turns.
   Single light cream look, shared with Keyfall, Snap Safari and Fetch Maze. */
:root {
  --cream: #F7F3EA;
  --floor: #F1ECE1;
  --card: #FFFDF9;
  --ink: #1D1D1F;
  --ink-2: #6E6E73;
  --ink-3: #A1A1A6;
  --ink-soft: #3A3A3C;     /* long explanations: a little softer than headings */
  --hair: #E3DCCD;
  --press: #EDE7DA;
  --dust: #C9BDA6;
  --blue: #0071E3;
  --blue-deep: #0058B0;
  --blue-tint: #E3EEFB;
  --blue-soft: #9CC3F0;    /* finished steps in a lesson's progress bar */
  --orange: #FF9500;
  --orange-ink: #A65500;   /* warning text: orange that stays readable on its tint */
  --orange-tint: #FFF4E5;
  --red: #FF3B30;
  --red-ink: #C9341F;
  --red-tint: #FDEBE8;
  --green: #2DA44E;
  --green-ink: #1F8A3A;
  --gold: #E9B02B;         /* stars, like the gold stars on the board */
  --wood: #8A5A37;         /* piece symbols in the panel, so they match the wooden set */
  --ring: rgba(0, 113, 227, 0.35);
  --scrim: rgba(247, 243, 234, 0.35);
  --shadow-soft: rgba(70, 52, 20, 0.12);
  --shadow-tight: rgba(70, 52, 20, 0.05);
  --shadow-btn: 0 1px 2px rgba(29, 29, 31, 0.10), 0 10px 28px rgba(29, 29, 31, 0.14);
  --shadow-btn-hover: 0 2px 4px rgba(29, 29, 31, 0.12), 0 16px 36px rgba(29, 29, 31, 0.18);
  --shadow-card: 0 1px 2px var(--shadow-tight), 0 18px 48px var(--shadow-soft);
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;   /* chess notation, so moves line up */
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--cream);
  color: var(--ink);
  font: 15px/1.45 var(--font-text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, .panel:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* The board fills the screen until Start; then the panel takes a column on the right, or the bottom half on phones */
.app { position: relative; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.app.with-panel { grid-template-columns: minmax(0, 1fr) minmax(340px, 400px); }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#gl { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
.panel { background: var(--card); border-left: 1px solid var(--hair); overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
@media (max-width: 820px) {
  .app.with-panel { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .panel { border-left: 0; border-top: 1px solid var(--hair); border-radius: 20px 20px 0 0; max-height: 50vh; box-shadow: 0 -6px 24px var(--shadow-soft); }
}

/* Start */
.layer { position: absolute; inset: auto 0 16%; display: flex; justify-content: center; pointer-events: none; }
.btn-primary {
  pointer-events: auto; appearance: none; border: 0; cursor: pointer;
  font: 600 19px/1 var(--font-display); letter-spacing: -0.01em;
  color: var(--card); background: var(--ink);
  height: 58px; padding: 0 56px; border-radius: 999px;
  box-shadow: var(--shadow-btn);
  transition: transform .2s cubic-bezier(.2, .8, .2, 1), box-shadow .2s ease;
}
.nogl {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0;
  width: min(340px, calc(100% - 32px)); padding: 20px 22px; text-align: center;
  background: var(--card); border-radius: 18px; box-shadow: var(--shadow-card); color: var(--ink-2);
}

/* Buttons that float over the board */
.corner { position: absolute; top: 14px; display: flex; gap: 8px; z-index: 5; }
.corner.tl { left: max(16px, env(safe-area-inset-left, 0px)); }
.corner.tr { right: max(16px, env(safe-area-inset-right, 0px)); }
.cbtn {
  height: 36px; min-width: 36px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--hair); background: var(--card);
  font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 2px 10px var(--shadow-soft); transition: transform .15s ease;
}
.cbtn:active { transform: scale(.95); }
.cbtn.icon { padding: 0; width: 36px; }
.cbtn svg { width: 16px; height: 16px; flex: none; }
.tip {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); margin: 0;
  background: rgba(29, 29, 31, .78); color: var(--card); font-size: 13px; font-weight: 500;
  padding: 7px 14px; border-radius: 999px; pointer-events: none; white-space: nowrap;
}

/* Panel screens */
.pv { padding-block: 26px 28px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 820px) {
  .pv { padding-block: 18px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); gap: 13px; }
}
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.h-xl { margin: 0; font: 700 30px/1.1 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
.h-lg { margin: 0; font: 700 24px/1.15 var(--font-display); letter-spacing: -.015em; text-wrap: balance; }
.h-sm { margin: 4px 0 -6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.txt { font-size: 16px; line-height: 1.55; max-width: 62ch; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.lead { margin: -6px 0 0; }
.flush { margin: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.nav { justify-content: space-between; margin-top: 2px; }
.btn {
  height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--press);
  font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  transition: transform .12s ease, background-color .2s ease, opacity .2s ease;
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.primary { background: var(--blue); color: var(--card); }
.btn:disabled { opacity: .38; cursor: default; }
.btn.grow { flex: 1; padding: 0 12px; white-space: nowrap; }
.start-game { margin-top: 6px; }
.link { border: 0; background: none; padding: 0; color: var(--blue); font-weight: 600; font-size: 15px; }

/* Home */
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center;
  padding: 14px 16px; border-radius: 18px; border: 0; background: var(--cream); text-align: left;
  transition: transform .15s ease, background-color .2s ease;
}
.choice:active { transform: scale(.985); }
.choice .glyph {
  width: 52px; height: 52px; border-radius: 14px; background: var(--card); display: grid; place-items: center;
  font-size: 30px; line-height: 1; color: var(--wood); box-shadow: 0 1px 3px var(--shadow-soft);
}
.choice b { display: block; font-size: 17px; font-weight: 600; }
.choice .s { display: block; font-size: 13.5px; color: var(--ink-2); margin-top: 1px; }
.chev { color: var(--dust); }
.bar { display: block; height: 4px; border-radius: 4px; background: var(--hair); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 4px; }

/* Lesson list */
.lessons { display: flex; flex-direction: column; gap: 6px; }
.les {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 11px 12px; border-radius: 14px; border: 0; background: transparent; text-align: left;
}
.les .num {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--press);
  font: 700 15px/1 var(--font-round); font-variant-numeric: tabular-nums;
}
.les.done .num { background: var(--green); color: var(--card); }
.les b { display: block; font-weight: 600; font-size: 16px; }
.les .s { display: block; font-size: 13px; color: var(--ink-2); }

/* Lesson */
.dots { display: flex; gap: 6px; }
.dots span { height: 6px; flex: 1; max-width: 44px; border-radius: 6px; background: var(--hair); }
.dots span.on { background: var(--blue); }
.dots span.done { background: var(--blue-soft); }
.task { background: var(--cream); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.task .label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.task .do { font-size: 16.5px; font-weight: 600; line-height: 1.4; }
.task .big { font: 700 22px/1.2 var(--font-display); }
.task .big .sq { font-family: var(--font-mono); font-size: 26px; color: var(--blue); margin-left: 4px; }
.task .meta { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.fb { font-size: 15px; font-weight: 600; min-height: 1.4em; }
.fb.good { color: var(--green-ink); }
.fb.bad { color: var(--red-ink); }
.pips { display: flex; gap: 5px; }
.pips i { width: 10px; height: 10px; border-radius: 50%; background: var(--hair); }
.pips i.on { background: var(--gold); }

/* Piece values and notation */
.vals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.val { display: flex; align-items: center; gap: 10px; background: var(--cream); border-radius: 12px; padding: 8px 12px; min-width: 0; }
.val .glyph { font-size: 22px; line-height: 1; color: var(--wood); width: 22px; text-align: center; }
.val .vn { flex: 1; font-size: 14px; min-width: 0; }
.val .vv { font: 700 16px/1 var(--font-round); font-variant-numeric: tabular-nums; }
.val .vx { font-size: 13px; color: var(--ink-2); }
.mono, .val .vv.mono { font-family: var(--font-mono); font-size: 14px; }
.sym { min-width: 52px; }

/* Word chips and their definition card */
.chip {
  display: inline; border: 0; background: var(--blue-tint); color: var(--blue-deep);
  font: inherit; font-weight: 600; padding: 1px 7px; margin: 0 1px; border-radius: 7px; line-height: 1.5;
}
.pop {
  position: fixed; z-index: 60; max-width: 290px; background: var(--card); border: 1px solid var(--hair);
  border-radius: 16px; box-shadow: var(--shadow-card); padding: 13px 15px;
  display: flex; flex-direction: column; gap: 5px;
}
.pop .t { font-weight: 700; font-size: 16px; }
.pop .d { font-size: 14.5px; line-height: 1.45; color: var(--ink-soft); }
.pop .link { font-size: 14px; align-self: flex-start; margin-top: 3px; }

/* Level and side pickers */
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--press); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { height: 38px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; font-size: 14.5px; transition: background-color .2s ease; }
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 4px var(--shadow-soft); }
.note { font-size: 14px; color: var(--ink-2); min-height: 2.9em; }

/* Game */
.status { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 13px; border-radius: 999px; background: var(--cream); font-weight: 600; font-size: 14px; }
.pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
.pill.cpu i { background: var(--dust); animation: blink 1s ease-in-out infinite; }
.pill.check { background: var(--red-tint); color: var(--red-ink); }
.pill.check i { background: var(--red); }
.coach { display: flex; flex-direction: column; gap: 10px; }
.line { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.line .who { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; line-height: 1; background: var(--press); color: var(--ink); }
.line.cpu .who { background: var(--ink); color: var(--card); }
.line.coach-l .who { background: var(--blue-tint); color: var(--blue-deep); }
.line b { display: block; font-weight: 600; font-size: 15.5px; }
.line p { margin: 1px 0 0; font-size: 14.5px; color: var(--ink-soft); }
.warn { background: var(--orange-tint); color: var(--orange-ink); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; font-weight: 600; display: flex; gap: 8px; align-items: flex-start; }
.warn svg { flex: none; width: 16px; height: 16px; margin-top: 2px; }
.hintbox { background: var(--blue-tint); color: var(--ink-soft); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; }
.hintbox b { color: var(--blue-deep); }
.moves { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; font: 13px/1.4 var(--font-mono); color: var(--ink-2); }
.moves::-webkit-scrollbar { display: none; }
.moves span { white-space: nowrap; padding: 3px 7px; border-radius: 7px; background: var(--cream); }
.moves span.last { background: var(--ink); color: var(--card); }
.result { background: var(--cream); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.result .h-lg { font-size: 22px; }
.result .row { margin-top: 6px; }

/* Glossary */
.search { height: 42px; border-radius: 12px; border: 1px solid var(--hair); background: var(--cream); padding: 0 14px; font: inherit; font-size: 15px; width: 100%; }
.gl { display: flex; flex-direction: column; }
.gl div { padding: 11px 0; border-bottom: 1px solid var(--hair); }
.gl b { display: block; font-size: 15.5px; }
.gl span { font-size: 14.5px; color: var(--ink-soft); }

/* Promotion picker */
.promo { position: absolute; inset: 0; display: grid; place-items: center; background: var(--scrim); z-index: 8; }
.promo .card { background: var(--card); border-radius: 20px; padding: 18px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.promo .opts { display: grid; grid-template-columns: repeat(4, 64px); gap: 8px; }
.promo .opts button { height: 78px; border: 0; border-radius: 14px; background: var(--cream); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; }
.promo .opts button span { font-size: 32px; line-height: 1; color: var(--wood); }

/* Entrances */
.pop:not([hidden]) { animation: rise-in .18s ease both; }
.promo:not([hidden]) .card { animation: rise-in .3s cubic-bezier(.2, .9, .3, 1.15) both; }
@keyframes rise-in { from { opacity: 0; transform: translateY(6px); } }
@keyframes blink { 50% { opacity: .25; } }

@media (hover: hover) {   /* no sticky hover after a tap on touch screens */
  .btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-btn-hover); }
  .choice:hover, .les:hover { background: var(--press); }
  .chip:hover { background: #D7E7FB; }
  .promo .opts button:hover { background: var(--press); }
  .link:hover { color: var(--blue-deep); }
}
.btn-primary:active { transform: scale(.97); box-shadow: var(--shadow-btn); }   /* after hover, so a press always shrinks */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<main class="app" id="app">
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="3D chess board. Tap or click a piece, then a square. Drag to turn the board. With a keyboard, use the arrow keys and Enter."></canvas>
    <div class="corner tl">
      <button class="cbtn" id="menuBtn" type="button" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span>Menu</span></button>
    </div>
    <div class="corner tr">
      <button class="cbtn icon" id="viewBtn" type="button" hidden aria-label="Reset view" title="Reset view"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4"/><path d="M2.5 2.5v3h3"/></svg></button>
      <button class="cbtn" id="soundBtn" type="button" hidden aria-pressed="true"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path class="waves" d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.3 3.8a6 6 0 0 1 0 8.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Sound on</span></button>
    </div>
    <section class="layer" id="start">
      <button class="btn-primary" id="startBtn" type="button">Start</button>
    </section>
    <p class="nogl" id="noGL" hidden>Knight School draws a 3D board with WebGL, and this browser has it turned off. Try another browser, or turn on hardware acceleration.</p>
    <p class="tip" id="dragTip" hidden>Drag to turn the board</p>
    <div class="promo" id="promo" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="promoTitle">
        <div class="eyebrow" id="promoTitle">Promote to</div>
        <div class="opts" id="promoOpts"></div>
      </div>
    </div>
  </div>
  <aside class="panel" id="panel" tabindex="-1" aria-label="Lessons and coach" hidden></aside>
  <div class="pop" id="pop" role="dialog" aria-label="Definition" hidden></div>
  <p class="sr" id="say" aria-live="polite"></p>
</main>

<script>
